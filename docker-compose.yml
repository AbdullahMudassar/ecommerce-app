services:
  product-service:
    image: product-service:v1
    ports:
      - "8081:8080"

  redis:
    image: redis:7-alpine

  cart-service:
    image: cart-service:v1
    ports:
      - "8082:8080"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  order-service:
    image: order-service:v1
    ports:
      - "8083:8080"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8080
    depends_on:
      - product-service
