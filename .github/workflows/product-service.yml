name: Product Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/product-service/**"

  pull_request:
    branches:
      - main
    paths:
      - "services/product-service/**"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/product-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/abdullahmudassar/product-service:${{ github.sha }} \
            services/product-service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/abdullahmudassar/product-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/abdullahmudassar/product-service:${{ github.sha }}
