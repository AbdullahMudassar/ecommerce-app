name: Cart Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/cart-service/**"

  pull_request:
    branches:
      - main
    paths:
      - "services/cart-service/**"

permissions:
  contents: read
  packages: write

jobs:

  # =========================
  # TEST JOB
  # =========================
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/cart-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/cart-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # =========================
  # BUILD + SCAN + PUSH
  # =========================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/abdullahmudassar/cart-service:${{ github.sha }} \
            services/cart-service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/abdullahmudassar/cart-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/abdullahmudassar/cart-service:${{ github.sha }}


  # =========================
  # UPDATE GITOPS REPOSITORY
  # =========================
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: AbdullahMudassar/ecommerce-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ecommerce-gitops

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update cart-service image
        working-directory: ecommerce-gitops/envs/dev
        run: |
          kustomize edit set image \
            cart-service=ghcr.io/abdullahmudassar/cart-service:${{ github.sha }}

      - name: Commit and push GitOps change
        working-directory: ecommerce-gitops
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add envs/dev/kustomization.yaml
          git commit -m "Update cart-service image to ${{ github.sha }}"
          git push
